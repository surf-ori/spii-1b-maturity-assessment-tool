                download_json_blob(all_frameworks(), "assessment-frameworks.json");
            }

            function load_custom_frameworks(file) {
                const reader = new FileReader();
                reader.onload = () => {
                    let parsed;
                    try {
                        parsed = JSON.parse(reader.result);
                    } catch (err) {
                        show_toast("That file is not valid JSON.", "error");
                        return;
                    }
                    import_custom_frameworks(Array.isArray(parsed) ? parsed : [parsed]);
                };
                reader.readAsText(file);
            }

            function add_valid_frameworks(frameworks) {
                const existingIds = all_frameworks().map((f) => f.id);
                let addedCount = 0;
                const skipped = [];
                frameworks.forEach((framework) => {
                    if (!validate_framework_shape(framework)) {
                        skipped.push((framework && framework.id) || "(unrecognised)");
                        return;
                    }
                    if (existingIds.includes(framework.id)) {
                        skipped.push(framework.id + " (already exists)");
                        return;
                    }
                    existingIds.push(framework.id);
                    state.customFrameworks.push(framework);
                    state.frameworks[framework.id] = framework_state_slice(framework);
                    addedCount++;
                });
                return { addedCount, skipped };
            }

            function import_custom_frameworks(frameworks) {
                const { addedCount, skipped } = add_valid_frameworks(frameworks);
                if (addedCount > 0) render();
                if (skipped.length > 0) {
                    show_toast("Some frameworks could not be imported: " + skipped.join(", "), "warning");
                } else if (addedCount === 0) {
                    show_toast("No valid assessment framework found in that file.", "error");
                }
            }

            function fetch_json_url(url, label) {
                return fetch(url)
                    .then((response) => {
                        if (!response.ok) throw new Error("HTTP " + response.status);
                        return response.json();
                    })
                    .catch((err) => {
                        show_toast('Could not load ' + label + ' from "' + url + '": ' + err.message, "error");
                        return null;
                    });
            }

            function load_from_url_params() {
                const params = new URLSearchParams(window.location.search);
                const frameworkUrl = params.get("framework");
                const reportUrl = params.get("report");
                if (!frameworkUrl && !reportUrl) return;

                Promise.all([
                    frameworkUrl ? fetch_json_url(frameworkUrl, "framework") : Promise.resolve(null),
                    reportUrl ? fetch_json_url(reportUrl, "report") : Promise.resolve(null),
                ]).then(([frameworkData, reportData]) => {
                    let changed = false;
                    if (frameworkData) {
                        const frameworksToAdd = Array.isArray(frameworkData) ? frameworkData : [frameworkData];
                        const { addedCount, skipped } = add_valid_frameworks(frameworksToAdd);
                        if (addedCount > 0) changed = true;
                        if (skipped.length > 0) {
                            show_toast("Some frameworks from the URL could not be loaded: " + skipped.join(", "), "warning");
                        }
                    }
                    if (reportData) {
                        state = merge_loaded_state(reportData, state);
                        changed = true;
                    }
                    if (changed) render();
                });
            }

            function download_pdf() {
                const detailsElements = Array.from(document.querySelectorAll("details"));
                const openStates = detailsElements.map((el) => el.open);
                detailsElements.forEach((el) => el.setAttribute("open", ""));
                const tabpanels = Array.from(document.querySelectorAll('[role="tabpanel"]'));
                const tabpanelHiddenStates = tabpanels.map((el) => el.hidden);
                tabpanels.forEach((el) => { el.hidden = false; });
                document.body.classList.add("printing");

                const doc = new jspdf.jsPDF();
                doc.html(document.body, {
                    callback: (doc) => {
                        doc.save("report.pdf");
                        document.body.classList.remove("printing");
                        detailsElements.forEach((el, i) => {
                            if (!openStates[i]) el.removeAttribute("open");
                        });
                        tabpanels.forEach((el, i) => { el.hidden = tabpanelHiddenStates[i]; });
                    },
                    x: 10,
                    width: 200,
                    windowWidth: 1000,
                });
            }

            let detailsOpenBeforePrint = null;
            let tabpanelsHiddenBeforePrint = null;

            window.addEventListener("beforeprint", () => {
                const detailsElements = Array.from(document.querySelectorAll("details"));
                detailsOpenBeforePrint = detailsElements.map((el) => el.open);
                detailsElements.forEach((el) => el.setAttribute("open", ""));
                const tabpanels = Array.from(document.querySelectorAll('[role="tabpanel"]'));
                tabpanelsHiddenBeforePrint = tabpanels.map((el) => el.hidden);
                tabpanels.forEach((el) => { el.hidden = false; });
            });

            window.addEventListener("afterprint", () => {
                if (!detailsOpenBeforePrint) return;
                const detailsElements = Array.from(document.querySelectorAll("details"));
                detailsElements.forEach((el, i) => {
                    if (!detailsOpenBeforePrint[i]) el.removeAttribute("open");
                });
                detailsOpenBeforePrint = null;
                if (tabpanelsHiddenBeforePrint) {
                    const tabpanels = Array.from(document.querySelectorAll('[role="tabpanel"]'));
                    tabpanels.forEach((el, i) => { el.hidden = tabpanelsHiddenBeforePrint[i]; });
                    tabpanelsHiddenBeforePrint = null;
                }
            });

            function ring_config_for(framework) {
                const count = framework.sections.length;
                const step = count > 1 ? Math.min(14, (76 - 34) / (count - 1)) : 14;
                return framework.sections.map((section, i) => ({
                    section: section,
                    radius: 34 + i * step,
                }));
            }

            const STATUS_COLOR_VAR = {
                compliant: "--compliant",
                progress: "--warning",
                "non-compliant": "--destructive",
            };

            function status_color(status) {
                const varName = STATUS_COLOR_VAR[status];
                if (!varName) return "#cccccc";
                const value = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
                return value || "#cccccc";
            }

            function escape_xml(str) {
                return str
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            function selected_activity_items(state) {
                const items = [];
                [ACTIVITIES.primary, ACTIVITIES.related].forEach((group) => {
                    group.items.forEach((item) => {
                        if (state.activities.includes(group.title + " > " + item)) items.push(item);
                    });
                });
                return items;
            }

            function build_badge_svg_markup(state) {
                const width = 200;
                const height = 288;
                const center = width / 2;
                const ringCenterY = 140;
                const strokeWidth = 10;
                let circles = "";
                const framework = all_frameworks().find((f) => f.id === activeFrameworkId);
                ring_config_for(framework).forEach((ring) => {
                    const section = ring.section;
                    const offsets = ring_segment_offsets(ring.radius, section.principles.length);
                    section.principles.forEach((principle, i) => {
                        const status = state.frameworks[framework.id][principle.id].status;
                        const color = status_color(status);
                        const off = offsets[i];
                        circles +=
                            '<circle cx="' + center + '" cy="' + ringCenterY + '" r="' + ring.radius +
                            '" fill="none" stroke="' + color + '" stroke-width="' + strokeWidth +
                            '" stroke-dasharray="' + off.dasharray + '" stroke-dashoffset="' + off.dashoffset +
                            '" transform="rotate(-90 ' + center + " " + ringCenterY + ')" />';
                    });
                });
                const summary = compute_summary(state, framework.id);
                const name = escape_xml(state.name || "Unnamed infrastructure");
                const date = escape_xml(state.assessedOn || "");
                const badgeTitle = escape_xml(framework.shortName + " Compliance");
                const activityIconSize = 14;
                const activityIconGap = 3;
                const activityItems = selected_activity_items(state);
                const activityRowWidth = activityItems.length
                    ? activityItems.length * activityIconSize + (activityItems.length - 1) * activityIconGap
                    : 0;
                let activityIcons = "";
                let iconX = center - activityRowWidth / 2;
                activityItems.forEach((item) => {
                    activityIcons += activity_icon_markup(
                        item,
                        activityIconSize,
                        "#333333",
                        ' x="' + iconX + '" y="243"'
                    );
                    iconX += activityIconSize + activityIconGap;
                });
                return (
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + width + " " + height + '" width="' + width + '" height="' + height + '">' +
                    '<rect width="' + width + '" height="' + height + '" fill="white" />' +
                    '<text x="' + center + '" y="24" text-anchor="middle" font-size="12" font-family="&quot;Outfit&quot;, sans-serif" font-weight="bold">' + badgeTitle + "</text>" +
                    circles +
                    '<text x="' + center + '" y="' + (ringCenterY + 7) + '" text-anchor="middle" font-size="26" font-family="&quot;Outfit&quot;, sans-serif" font-weight="bold">' + summary.percentCompliant + "%</text>" +
                    '<text x="' + center + '" y="232" text-anchor="middle" font-size="11" font-family="&quot;Outfit&quot;, sans-serif">' + name + "</text>" +
                    activityIcons +
                    '<text x="' + center + '" y="272" text-anchor="middle" font-size="10" font-family="&quot;Outfit&quot;, sans-serif">' + date + "</text>" +
                    "</svg>"
                );
            }

            function update_badge() {
                const container = document.getElementById("badge-preview");
                if (!container) return;
                container.innerHTML = build_badge_svg_markup(state);
                const hovercard = document.getElementById("badge-hovercard");
                if (hovercard) hovercard.innerHTML = build_badge_hovercard_html(state);
            }

            function build_badge_hovercard_html(state) {
                const framework = all_frameworks().find((f) => f.id === activeFrameworkId);
                const summary = compute_summary(state, framework.id);
                const name = state.name || "Unnamed infrastructure";
                let html = "<strong>" + escape_xml(name) + "</strong>";
                html += "<div>Assessed " + escape_xml(state.assessedOn) + "</div>";
                html += "<div>" + escape_xml(framework.shortName) + " overall: " + summary.percentCompliant + "%</div>";
                framework.sections.forEach((section) => {
                    let compliant = 0;
                    let progress = 0;
                    let nonCompliant = 0;
                    section.principles.forEach((principle) => {
                        const status = state.frameworks[framework.id][principle.id].status;
                        if (status === "compliant") compliant++;
                        else if (status === "progress") progress++;
                        else if (status === "non-compliant") nonCompliant++;
                    });
                    html += "<div>" + escape_xml(section.section) + ": " + compliant + "✓ " + progress + "◐ " + nonCompliant + "✗</div>";
                });
                return html;
            }

            // Self-contained: everything the badge needs (SVG markup, hovercard
            // content, hover-reveal CSS) is inlined into the returned string
            // using plain hex colors rather than this app's own CSS custom
            // properties, since a page this gets pasted into won't have those
            // tokens defined. It's a snapshot of `state` at call time, not a
            // live embed — there's no backend for a pasted snippet to call
            // back into, so "self-contained" is the only kind of embed this
            // tool can offer.
            function build_badge_embed_html(state) {
                const svg = build_badge_svg_markup(state);
                const hovercardInner = build_badge_hovercard_html(state);
                return (
                    '<div class="osmat-badge-embed" tabindex="0" style="position:relative;display:inline-block;font-family:system-ui,sans-serif;">' +
                    "<style>" +
                    ".osmat-badge-embed .osmat-badge-hovercard{position:absolute;left:0;right:0;bottom:100%;z-index:10;background:#ffffff;color:#18181b;border:1px solid #e4e4e7;border-radius:8px;padding:12px;font-size:12px;line-height:1.5;opacity:0;visibility:hidden;transition:opacity .15s ease;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.12)}" +
                    ".osmat-badge-embed:hover .osmat-badge-hovercard,.osmat-badge-embed:focus-within .osmat-badge-hovercard{opacity:1;visibility:visible}" +
                    "</style>" +
                    svg +
                    '<div class="osmat-badge-hovercard">' + hovercardInner + "</div>" +
                    "</div>"
                );
            }

            function download_badge_embed() {
                const html = build_badge_embed_html(state);
                const blob = new Blob([html], { type: "text/html" });
                trigger_download(URL.createObjectURL(blob), "badge-embed.html");
            }

            async function copy_badge_embed() {
                const html = build_badge_embed_html(state);
                if (!window.isSecureContext || !navigator.clipboard) {
                    download_badge_embed();
                    show_toast("Clipboard access isn’t available here; downloaded the embed code as an HTML file instead.", "warning");
                    return;
                }
                try {
                    await navigator.clipboard.writeText(html);
                    show_toast("Embed code copied to clipboard — paste it into your site’s HTML.", "success");
                } catch (err) {
                    download_badge_embed();
                    show_toast("Couldn’t copy to clipboard; downloaded the embed code as an HTML file instead.", "warning");
                }
            }

            function trigger_download(href, filename) {
                const link = document.createElement("a");
                link.href = href;
                link.download = filename;
                link.style.display = "none";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(link.href), 0);
            }

            function download_badge_svg() {
                const markup = build_badge_svg_markup(state);
                const blob = new Blob([markup], { type: "image/svg+xml" });
                trigger_download(URL.createObjectURL(blob), "badge.svg");
            }

            function download_badge_png() {
                const markup = build_badge_svg_markup(state);
                const svgBlob = new Blob([markup], { type: "image/svg+xml" });
                const url = URL.createObjectURL(svgBlob);
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    canvas.width = 200;
                    canvas.height = 260;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                    canvas.toBlob((blob) => {
                        if (!blob) {
                            show_toast("Could not generate the badge image.", "error");
                            return;
                        }
                        trigger_download(URL.createObjectURL(blob), "badge.png");
                    });
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    show_toast("Could not generate the badge image.", "error");
                };
                img.src = url;
            }

            document.getElementById("sidebar-nav").addEventListener("click", (e) => {
                if (e.target.tagName !== "A") return;
                document.getElementById("app-shell").removeAttribute("data-sidebar-open");
                document.getElementById("sidebar-toggle").setAttribute("aria-expanded", "false");
            }, true);

            document.getElementById("sidebar-toggle").addEventListener("click", (e) => {
                const isOpen = document.getElementById("app-shell").toggleAttribute("data-sidebar-open");
                e.currentTarget.setAttribute("aria-expanded", String(isOpen));
            });

            document.getElementById("about-dialog-content").innerHTML = ABOUT_TOOL_HTML;
            document.getElementById("changelog-dialog-content").innerHTML = CHANGELOG_HTML;

            document.getElementById("import-report-input").addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (file) load_json(file);
                e.target.value = "";
            });
            document.getElementById("import-framework-input").addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (file) load_custom_frameworks(file);
                e.target.value = "";
            });
            document.getElementById("import-report-btn").addEventListener("click", () => {
                document.getElementById("import-report-input").click();
            });
            document.getElementById("import-framework-btn").addEventListener("click", () => {
                document.getElementById("import-framework-input").click();
            });
            document.getElementById("download-template-btn").addEventListener("click", download_framework_template);
            document.getElementById("export-report-btn").addEventListener("click", download_json);
            document.getElementById("print-report-btn").addEventListener("click", download_pdf);
            document.getElementById("download-frameworks-btn").addEventListener("click", download_all_frameworks);
            document.getElementById("save-report-github-btn").addEventListener("click", open_save_report_dialog);
            document.getElementById("save-report-dialog-content").addEventListener("click", (e) => {
                const link = e.target.closest(".save-report-link");
                if (!link) return;
                download_json_blob(build_export_object(state), link.dataset.filename);
            });

            function position_popover(button, popover) {
                const rect = button.getBoundingClientRect();
                const gap = 4;
                let left = rect.left;
                const maxLeft = window.innerWidth - popover.offsetWidth - 8;
                if (left > maxLeft) left = Math.max(8, rect.right - popover.offsetWidth);
                popover.style.left = left + "px";
                popover.style.top = (rect.bottom + gap) + "px";
            }

            document.querySelectorAll("ot-dropdown").forEach((dropdown) => {
                const button = dropdown.querySelector("button[popovertarget]");
                const popover = dropdown.querySelector("[popover]");
                if (!button || !popover) return;
                popover.addEventListener("toggle", (e) => {
                    if (e.newState === "open") position_popover(button, popover);
                });
                popover.addEventListener("click", (e) => {
                    if (e.target.closest('[role="menuitem"]')) popover.hidePopover();
                });
            });

            const appRoot = document.getElementById("app");
            appRoot.addEventListener("click", (e) => {
                const card = e.target.closest(".status-card");
                if (!card) return;
                const details = card.closest("[data-principle-id]");
                set_status(details.dataset.frameworkId, details.dataset.principleId, card.dataset.status);
            });
            appRoot.addEventListener("input", (e) => {
                if (e.target.matches("textarea.notes")) {
                    const details = e.target.closest("[data-principle-id]");
                    state.frameworks[details.dataset.frameworkId][details.dataset.principleId].notes = e.target.value;
                }
            });
            appRoot.addEventListener("keydown", (e) => {
                if (e.key !== "Enter" && e.key !== " ") return;
                const card = e.target.closest(".status-card");
                if (!card) return;
                e.preventDefault();
                const details = card.closest("[data-principle-id]");
                set_status(details.dataset.frameworkId, details.dataset.principleId, card.dataset.status);
            });

            function render_boot_error(err) {
                console.error(err);
                document.getElementById("app").innerHTML =
                    '<div role="alert" data-variant="error">' +
                    "<p><strong>Could not load the assessment frameworks.</strong></p>" +
                    "<p>This page loads POSI, SPII, and OSR from JSON files in <code>data/frameworks/</code> via <code>fetch()</code>, which requires the page to be served over http(s) — it will not work when opened directly as a <code>file://</code> page. Serve this directory with any static file server (for example <code>python3 -m http.server</code>, then open <code>http://localhost:8000/</code>) and reload.</p>" +
                    "</div>";
            }

            async function boot() {
                try {
                    FRAMEWORKS = await load_builtin_frameworks();
                } catch (err) {
                    render_boot_error(err);
                    return;
                }
                activeFrameworkId = FRAMEWORKS[0].id;
                // A URL hash naming a framework (e.g. "#gorc") opens straight
                // to that framework's tab, with its sidebar group expanded.
                const hashFrameworkId = framework_id_from_hash();
                if (hashFrameworkId) {
                    activeTabId = hashFrameworkId;
                    activeFrameworkId = hashFrameworkId;
                }
                state = initial_state();
                render();
                await load_from_url_params();
            }
            window.addEventListener("hashchange", () => {
                const hashFrameworkId = framework_id_from_hash();
                if (hashFrameworkId && hashFrameworkId !== activeTabId) switch_tab(hashFrameworkId);
            });
            boot();
        </script>
    </body>
</html>
