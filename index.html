        <!-- <link rel="stylesheet" href="https://unpkg.com/@knadh/oat/oat.min.css"> -->
        <link rel="stylesheet" href="oat.min.css">
        <style>
            /* Self-hosted, matching spii-overview's fonts (replaces the
               previous Google Fonts "Source Sans 3" load, which never
               actually resolved --font-sans in this file, see the
               2026-09-15 changelog entry below). */
            @font-face {
                font-family: "Outfit";
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                src: url("fonts/outfit-400.woff2") format("woff2");
            }
            @font-face {
                font-family: "Outfit";
                font-style: normal;
                font-weight: 500;
                font-display: swap;
                src: url("fonts/outfit-500.woff2") format("woff2");
            }
            @font-face {
                font-family: "Outfit";
                font-style: normal;
                font-weight: 600;
                font-display: swap;
                src: url("fonts/outfit-600.woff2") format("woff2");
            }
            @font-face {
                font-family: "Outfit";
                font-style: normal;
                font-weight: 700;
                font-display: swap;
                src: url("fonts/outfit-700.woff2") format("woff2");
            }
            @font-face {
                font-family: "IBM Plex Mono";
                font-style: normal;
                font-weight: 500;
                font-display: swap;
                src: url("fonts/ibm-plex-mono-500.woff2") format("woff2");
            }

            /* Reskinned to match spii-overview's palette and type (see
               https://github.com/surf-ori/spii-overview); overrides both
               this file's own tokens (--compliant etc.) and oat.min.css's
               base tokens (--background, --card, --accent, ...), which
               works because these unlayered :root rules already win over
               Oat's own @layer-wrapped defaults — see the notes on
               [role="menuitem"] below for the same cascade-layer mechanic. */
            :root {
                --background: #f6f4ec;
                --foreground: #161f18;
                --card: #ffffff;
                --card-foreground: #161f18;
                --border: #d9d4c3;
                --input: #d9d4c3;
                --muted: #eeebdf;
                --muted-foreground: #4d5850;
                --accent: #dfe9df;
                --accent-foreground: #161f18;
                --secondary: #eeebdf;
                --secondary-foreground: #161f18;
                --ring: #1f5c43;
                --primary: #1f5c43;
                --primary-foreground: #fbfdfb;
                --warning: rgba(202,138,4,1);
                --destructive: rgba(185,28,28,1);
                --compliant: #1f5c43;
                --font-sans: "Outfit", system-ui, sans-serif;
                --font-mono: "IBM Plex Mono", ui-monospace, monospace;
                --focus-ring: var(--primary);
                --sidebar-width: 18rem;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --background: #10140f;
                    --foreground: #eae7db;
                    --card: #161c15;
                    --card-foreground: #eae7db;
                    --border: #2b342a;
                    --input: #2b342a;
                    --muted: #1c231b;
                    --muted-foreground: #9fad9f;
                    --accent: #1e2c22;
                    --accent-foreground: #eae7db;
                    --secondary: #1c231b;
                    --secondary-foreground: #eae7db;
                    --ring: #59b98a;
                    --primary: #59b98a;
                    --primary-foreground: #10140f;
                    --warning: rgba(250,204,21,1);
                    --destructive: rgba(248,113,113,1);
                    --compliant: #59b98a;
                    --focus-ring: var(--primary);
                }
                a {
                    color: #7fd1a6;
                }
            }

            body {
                margin: 0;
                font-family: var(--font-sans);
                /* Defensive: at the narrowest real device width tested
                   (320px, e.g. first-gen iPhone SE) a ~10px min-content
                   overflow remains even after the grid/flex min-width fixes
                   above, from no single element — it's the browser's
                   shrink-to-fit sizing for the .row/.col-N pairs refusing to
                   go below some inner content's min-content width. Rather
                   than chase that last few px through Oat's grid internals,
                   this keeps it from ever surfacing as a visible horizontal
                   scrollbar; nothing on the page relies on horizontal
                   scrolling. */
                overflow-x: hidden;
            }

            /* The inset moves from body's margin onto #app here instead of
               staying a body margin: [data-sidebar-layout]'s off-canvas math
               (translateX(-100%) on mobile) assumes the shell sits flush against
               the real viewport edge — a body margin leaves a sliver of the
               sidebar visible past that inset when it's supposed to be hidden. */
            #app-shell > main {
                padding: var(--space-8);
                min-width: 0;
            }

            /* Constrains line length on wide viewports instead of letting content
               stretch edge-to-edge; #app is targeted directly (rather than adding
               a .container class in JS) since it's a single fixed, known element. */
            #app {
                max-width: var(--container-max);
                margin-inline: auto;
            }

            /* Confirmed overflowing horizontally on real Android/Chrome and
               Android/Firefox (this repo's own dev-container testing under a
               simulated mobile viewport wasn't catching it — see below for
               why). Two layered causes:
               1. nav[data-topnav] is grid-column: 1 / -1 inside #app-shell's
                  grid, and — just like a flex item — a grid item's default
                  min-width is auto (its content's own min-content size), not
                  0. That let nav's rendered box grow wider than its 1fr grid
                  track to fit its buttons' natural width instead of being
                  clamped to the viewport, which is what made the dev-container
                  Playwright checks miss it earlier: they measured individual
                  children's computed sizes but never actually asserted
                  document.documentElement.scrollWidth stayed within
                  clientWidth. min-width: 0 here lets the grid item shrink.
               2. Even shrunk to the viewport's width, the Import/Export
                  dropdowns plus the About and Changelog buttons alone need
                  roughly 340px, which doesn't fit next to the logo on a
                  ~360-412px phone; flex-wrap lets them flow onto a second row
                  instead of forcing nav wider than its (now-clamped) grid
                  track. */
            nav[data-topnav] {
                padding: var(--space-4) var(--space-6);
                min-width: 0;
                flex-wrap: wrap;
                row-gap: var(--space-2);
            }

            /* Also a real bug, found alongside the above: a flex item's
               default min-width is auto (its content size), not 0, so this
               <strong> refused to shrink past its full text width and
               wrapped across ~6 lines instead of yielding space to whatever
               else was on its row. min-width: 0 lets it shrink; the rest
               truncates the overflow with an ellipsis rather than wrapping. */
            nav[data-topnav] > strong {
                font-size: var(--text-4);
                min-width: 0;
                max-width: 100%;
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
            }

            .topnav-spacer {
                flex: 1;
            }

            /* oat.min.css wraps its own [role=menuitem] rules (including its
               :hover/:focus highlight) inside @layer components; unlayered
               author styles always win over layered ones regardless of
               specificity, so overriding background-color here — needed to
               stop menu items looking like solid buttons — silently ate
               Oat's own hover highlight too. Restating hover/focus here
               keeps that highlight working. */
            [role="menuitem"] {
                flex-direction: column;
                align-items: flex-start;
                text-align: left;
                background-color: transparent;
                color: var(--foreground);
                border: none;
                border-radius: 0;
            }

            [role="menuitem"]:hover,
            [role="menuitem"]:focus {
                background-color: var(--accent);
                outline: none;
            }

            .menuitem-title {
                font-weight: var(--font-medium);
            }

            .menuitem-desc {
                font-size: var(--text-8);
                color: var(--muted-foreground);
            }

            /* oat.min.css already puts overflow-y: auto on a dialog's direct
               content div (:is(&,&>form)>:is(p,div,section)), but neither
               <dialog> nor its <form> is a flex container, so that div's
               height is just its own content's natural size — nothing ever
               constrains it smaller than the content, so overflow-y: auto
               never actually triggers a scrollbar; content past the
               dialog's own max-height: 85vh (also Oat's) was just clipped
               with no way to reach it. Making dialog/form a flex column and
               letting the content div grow/shrink (flex: 1; min-height: 0)
               within that fixed-height column is what makes it scroll.
               The [open] here is load-bearing, not decoration: the browser's
               UA stylesheet sets dialog:not([open]) { display: none }, and a
               bare, unscoped `dialog { display: flex }` would override that
               default even while closed — Oat's own closed-state styling
               (opacity: 0, transform: scale(.95)) only fades the dialog out,
               it doesn't rely on display; a closed-but-display:flex dialog
               stays in the layout, fixed and inset: 0 per Oat, invisible but
               still catching every click on the page underneath it. Caught this by a
               Playwright click failing with a "dialog#changelog-dialog
               subtree intercepts pointer events" error on an ordinary,
               unrelated button, on a page where neither dialog had ever been
               opened — exactly the kind of bug a screenshot alone would
               never show, since the dialog really is invisible right up
               until something tries to click through where it invisibly
               sits. */
            dialog[open] {
                display: flex;
                flex-direction: column;
            }

            dialog > form {
                display: flex;
                flex-direction: column;
                min-height: 0;
            }

            #about-dialog-content,
            #changelog-dialog-content {
                flex: 1;
                min-height: 0;
            }

            #changelog-dialog-content dt {
                font-weight: var(--font-medium);
                color: var(--muted-foreground);
                margin-top: var(--space-3);
            }

            #changelog-dialog-content dd {
                margin-inline-start: 0;
                margin-bottom: var(--space-2);
            }

            section {
                margin-top: var(--space-10);
            }

            .status-card {
                cursor: pointer;
                border: 2px solid transparent;
                transition: background-color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
            }

            .status-card:hover {
                background-color: var(--accent);
            }

            .status-card:active {
                transform: scale(0.98);
            }

            .status-card.selected[data-status="compliant"] { border-color: var(--compliant); }
            .status-card.selected[data-status="progress"] { border-color: var(--warning); }
            .status-card.selected[data-status="non-compliant"] { border-color: var(--destructive); }

            .status-card:focus-visible {
                outline: 2px solid var(--focus-ring);
                outline-offset: 2px;
            }

            .status-label {
                margin-block-start: var(--space-2);
                font-weight: bold;
            }

            .status-criteria {
                font-size: var(--text-8);
                margin-block-start: var(--space-1);
                font-weight: normal;
            }

            .improvement-action {
                margin-top: var(--space-2);
                font-style: italic;
            }

            textarea.notes {
                width: 100%;
                min-height: 6rem;
                margin-top: var(--space-2);
                font-family: var(--font-sans);
            }

            .summary-section {
                display: flex;
                align-items: baseline;
                gap: var(--space-6);
            }

            .summary-heading {
                font-size: var(--text-4);
                font-weight: bold;
            }

            .field {
                display: block;
                margin-bottom: var(--space-4);
            }

            .field span {
                display: block;
                font-weight: bold;
                margin-bottom: var(--space-1);
            }

            .field input,
            .field textarea {
                width: 100%;
            }

            /* The badge accordion sits at the very bottom of the sidebar
               (aside[data-sidebar] pins #sidebar-footer there via Oat's own
               margin-block-start: auto), so opening it "downward" the way a
               <details> normally does would either push it off the visible
               area or look like it's expanding into nothing. column-reverse
               keeps <summary> (the first DOM child) anchored at the visual
               bottom of the box and stacks the rest of the accordion's
               content above it instead, so it reads as unfurling upward.
               Oat's own details/summary styling (border, chevron rotation on
               [open], hover) is left as-is — only direction and the
               per-child margin (replaced with a flex gap, so spacing stays
               even regardless of DOM order) are overridden here. */
            #sidebar-footer > details {
                display: flex;
                flex-direction: column-reverse;
                gap: var(--space-3);
            }

            #sidebar-footer > details > *:not(summary) {
                margin: 0;
            }

            #sidebar-footer button {
                display: block;
                width: 100%;
                margin-top: var(--space-2);
            }

            #sidebar-footer svg {
                max-width: 100%;
                height: auto;

               not color — so this button's icon has always rendered white

               Unicode "☰" character and the SVG icon that replaced it;
               the SVG made it possible to spot in a code review (a blank
               button, rather than a plausible-looking tofu glyph). */
            [data-sidebar-toggle] {

            @media print {

                /* [data-sidebar-layout] fixes the page to 100dvh with an internally

            [role="tablist"] {

            }

            [role="tabpanel"] {

                box-shadow: var(--shadow-small);

            /* text-wrap: balance keeps headings from stranding a lone word on
               the last line; pretty does the softer equivalent for body copy.

            /* The containing <a> is a flex row (Oat's nav styling); without

            @media print {

            body.printing [role="tabpanel"] {

            /* nav[data-topnav] is position: sticky and sits at the very top of

               to plain var(--space-4) would render underneath/behind it. This
               top is only the pre-JS fallback (~72px, nav's un-wrapped

               getBoundingClientRect().bottom on every call, since nav can now
               wrap onto 2-3 rows on narrow viewports and a hardcoded value
               can't track that. */
            #toast-region {
                position: fixed;
                top: 5rem;
                right: var(--space-4);
                z-index: 100;
                display: flex;
                flex-direction: column;
                gap: var(--space-2);

            #toast-region [role="alert"] {
                box-shadow: var(--shadow-medium);

            }

            @keyframes toast-in {

            }

            @media print {

                    display: none;
                }
            }

            body.printing #toast-region {
                display: none;
            }

        <script id="app-logic">
            const ACTIVITIES = {

            const ABOUT_TOOL_HTML =
                "<p>This tool lets Open Science infrastructure providers, projects, funders, and programme teams reflect on and self-assess how open science values and principles are put into practice in an infrastructure’s design, governance, and operation.</p>" +
                "<p>It grew out of the SPII project’s exploration of a shared self-assessment approach for open science infrastructures. Rather than building a bespoke framework from scratch, we chose to begin with an existing, community-governed framework — the <a href=\"https://openscholarlyinfrastructure.org/\">Principles of Open Scholarly Infrastructure (POSI)</a> — so infrastructures can assess themselves against criteria the wider community already recognises, and so results can be compared and shared. The tool is designed to support additional assessment frameworks over time, not just POSI.</p>" +
                "<p>The underlying values — quality and integrity, collective benefit, and equity, fairness, diversity and inclusion — draw on UNESCO’s Open Science Recommendation and the Dutch National Plan Open Science (NPOS).</p>" +
                "<p>Not sure where to start? These example POSI assessment reports are based on published self-assessments from real infrastructures — click one to load it directly:</p>" +
                "<ul>" +
                '<li><a href="https://surf-ori.github.io/spii-1b-maturity-assessment-tool/?report=examples/openaire-posi-assessment-report-2026.json#posi">OpenAIRE (2026)</a></li>' +
                '<li><a href="https://surf-ori.github.io/spii-1b-maturity-assessment-tool/?report=examples/openalex-posi-assessment-report-2026.json#posi">OpenAlex (2026)</a></li>' +
                '<li><a href="https://surf-ori.github.io/spii-1b-maturity-assessment-tool/?report=examples/hal-posi-assessment-report-2024.json#posi">HAL+ / CCSD (2024)</a></li>' +
                "</ul>" +
                "<p>Source code: <a href=\"https://github.com/surf-ori/spii-1b-maturity-assessment-tool\">github.com/surf-ori/spii-1b-maturity-assessment-tool</a>. Built by Till Bey (SURF), Maurice Vanderfeesten (Vrije Universiteit Amsterdam &amp; SURF), and Sander Bosch (Vrije Universiteit Amsterdam). See <a href=\"CITATION.cff\">CITATION.cff</a> for full author identifiers.</p>";

            const CHANGELOG_HTML =
                "<dl>" +
                '<dt>2026-09-17</dt><dd>Added "Save Report to GitHub Tracker" (Export menu): downloads your report, then offers to open a new issue with it attached, or propose it as a file under <code>reports/</code> via a pull request (GitHub forks this repo for you automatically if you don’t have write access). Either way it opens a warning first: the report, including any name, description, or notes you’ve written, becomes public once submitted. No account or token is needed from this app; it only opens GitHub’s own pre-filled pages.</dd>' +
                '<dt>2026-09-16</dt><dd>Reordered the framework tabs and sidebar to SPII, POSI, GORC, FAIR, BD, OSR, and renamed three tab labels to match: “SPII v0.0.1 Assessment” is now “SPII v0.1 Assessment”, “BD Assessment v1.0” is now “BD v1.0 Assessment”, and “FAIR Principles Assessment” is now “FAIR v1.0 Assessment”. Sidebar framework sections now start collapsed (previously POSI, the only non-draft framework, started open) and behave as a single-open accordion — selecting a framework, from a tab or a sidebar link, expands its section and collapses every other one. The URL now tracks the open framework as a hash (e.g. <code>#gorc</code>), updated as you switch, and read back on load or if it changes while the page is open, so a link straight to one framework works and the address bar always matches what’s open.</dd>' +
                '<dt>2026-09-16</dt><dd>Reskinned to match the <a href="https://surf-ori.github.io/spii-overview/">SPII overview</a> page: swapped Oat’s and this tool’s own default color tokens for spii-overview’s palette (page background, cards, borders, the compliant/accent green, and hover tints), and self-hosted Outfit and IBM Plex Mono in place of the “Source Sans 3” Google Fonts load, which — per the 2026-09-15 entry below — had never actually resolved anyway. Oat’s own component structure (tabs, dialogs, dropdowns) is unchanged; only the tokens it reads from are new.</dd>' +
                '<dt>2026-09-16</dt><dd>Moved to <a href="https://github.com/surf-ori/spii-1b-maturity-assessment-tool">github.com/surf-ori/spii-1b-maturity-assessment-tool</a>, now also live at <a href="https://surf-ori.github.io/spii-1b-maturity-assessment-tool/">surf-ori.github.io/spii-1b-maturity-assessment-tool</a>. This repository also doubles as SPII deliverable 1B’s feedback tracker: open an issue here to propose a correction, flag a gap, or suggest an addition.</dd>' +
                '<dt>2026-09-16</dt><dd>Shortened two framework tab labels so they read better in the tab strip and sidebar nav: “Barcelona Declaration Assessment” is now “BD Assessment v1.0”, and “GORC International Model Assessment” is now “GORC v1.1 Assessment”. The full names (Barcelona Declaration on Open Research Information; Global Open Research Commons (GORC) International Model, version 1.1) are unchanged in each framework’s “About” accordion text — only the short `title` field used for the tab/sidebar/heading changed.</dd>' +
                '<dt>2026-09-16</dt><dd>Added a sixth framework, the FAIR Principles Assessment (draft) — a transcription of the <a href="https://www.gofair.foundation/fair-principles">FAIR Guiding Principles</a> (Wilkinson et al., 2016) as maintained by the GO FAIR Foundation. 15 principles across the four FAIR components (Findable, Accessible, Interoperable, Reusable) — one per sub-principle (F1–F4, A1/A1.1/A1.2/A2, I1–I3, R1/R1.1–R1.3) — with each principle’s text transcribed verbatim, cross-checked against the FAIR Vocabulary ontology; only the compliant/progress/non-compliant criteria are this tool’s own, since the FAIR principles have no official pass/fail rubric of their own.</dd>' +
                '<dt>2026-09-16</dt><dd>Added a fifth framework, the GORC International Model Assessment (draft) — an adaptation of the Research Data Alliance’s <a href="https://doi.org/10.15497/RDA00119">Global Open Research Commons (GORC) International Model, version 1.1</a> (2024), a large, aspirational (not prescriptive) framework for planning, developing, or operating a research commons of any kind. 55 principles across the model’s ten essential elements (Governance & Leadership, Rules of Participation & Access, Sustainability, Engagement, Human Capacity, Interoperability, Standards & Conventions, ICT Infrastructure, Services & Tools, Research Objects) — one per model category, plus a handful for Core, element-wide attributes not captured under any single category. By far the largest framework in this tool so far, reflecting the much larger scope of its source model (~290 attributes and features); its compliant/progress/non-compliant criteria are this tool’s own compression of the model’s Core/Desirable/Optional consideration levels, not part of the official model.</dd>' +
                '<dt>2026-09-16</dt><dd>Added a fourth framework, the Barcelona Declaration Assessment (draft) — an adaptation of the <a href="https://www.barcelona-declaration.org">Barcelona Declaration on Open Research Information</a> (2024), which commits signatories to making openness of research information the default, working with services and systems that enable it, supporting the sustainability of the infrastructures behind it, and coordinating collective action. 8 principles across four sections, one per commitment, transcribed verbatim from the Declaration’s own text.</dd>' +
                '<dt>2026-09-16</dt><dd>Fixed the About and Changelog dialogs not scrolling — long content past the dialog’s own height limit was simply clipped, with no way to reach it. Moved the assessment badge, and its SVG/PNG/embed export buttons, into a collapsed-by-default accordion at the bottom of the sidebar (opens upward, so it doesn’t push content off-screen) instead of always taking up sidebar space. Added a third badge export option, “Embed badge”, which copies a self-contained HTML snippet — including the same hover-to-reveal interaction as the in-app badge — that can be pasted directly into another site’s HTML; it is a snapshot of the current report at the moment it’s copied, not a live embed.</dd>' +
                '<dt>2026-09-15</dt><dd>Fixed the top bar genuinely overflowing horizontally on narrow phones (confirmed on real Android Chrome and Firefox), which the previous “fixed the title wrapping” entry below did not fully resolve on its own: <code>nav[data-topnav]</code> is a CSS Grid item and — like a flex item — defaults to <code>min-width: auto</code>, letting it grow wider than its column to fit its buttons; it now also wraps its buttons onto extra rows on narrow viewports. Also fixed the mobile menu (hamburger) icon rendering invisible — white-on-white due to an inherited button text color, not a missing icon glyph as it first appeared — and made the dismissible toast notices position themselves below the top bar correctly now that its height can vary.</dd>' +
                '<dt>2026-09-15</dt><dd>Design pass: fixed the <code>--font-sans</code> token (“Source Sans 3”) never actually loading, so the page was silently rendering system fonts everywhere including the exported badge; added a hover/active state to the compliant/progress/non-compliant picker cards, which previously gave no feedback on mouse interaction; replaced every <code>window.alert()</code> (JSON import errors, partial framework imports, failed badge downloads) with a dismissible toast notice; fixed the top bar’s title wrapping across several lines on narrow viewports instead of truncating; added a shadow to each framework tab’s panel to match Oat’s own card styling, and page description/social-sharing meta tags.</dd>' +
                '<dt>2026-09-15</dt><dd>The three built-in frameworks (POSI, SPII, OSR) moved out of <code>index.html</code> into standalone JSON files under <code>data/frameworks/</code>, loaded via <code>fetch()</code> at startup — edit a framework’s principles or criteria directly in its JSON file, no code change needed. As a result, opening <code>index.html</code> directly as a <code>file://</code> page no longer works (browsers block that fetch); serve the directory with any static file server instead, as already recommended for the <code>?report=</code>/<code>?framework=</code> URL-parameter loader. A clear on-page message explains this if frameworks fail to load.</dd>' +
                '<dt>2026-09-15</dt><dd>Added a third framework, OSR v0.1 (draft) — an adaptation of Jeroen Bosman and Jeroen Sondervan’s open science resilience model from <a href="https://upstream.force11.org/the-resilience-of-open-science-in-times-of-crisis/">“The Resilience of Open Science in Times of Crisis”</a> (Upstream, FORCE11, 2025), related to the International Science Council’s <em>Protecting Science in Times of Crisis</em> (2024). 25 principles across five areas of concern (funding, infrastructure, academic freedom, safety, disinformation), each scored across five resilience types (prevention, protection, resistance, withstanding, repair).</dd>' +
                '<dt>2026-08-27</dt><dd>Renamed to “Open Science Infrastructure Self-Assessment Tool” and moved to <a href="https://github.com/surf-ori/open-science-maturity">github.com/surf-ori/open-science-maturity</a>, now also live at <a href="https://surf-ori.github.io/open-science-maturity/">surf-ori.github.io/open-science-maturity</a>. Visual refresh leaning on Oat’s own grid and type scale; main content moved into tabs (one per framework, showing a live scored/total count); sidebar navigation now lists every principle individually with a compliant/progress/non-compliant/unanswered status icon; a top bar with the app title and Import/Export menus, plus About and Changelog as dialogs instead of taking up space in the sidebar and main content. You can now import your own custom assessment framework (JSON) alongside POSI and SPII, download a template to help author one, and export whichever frameworks are currently loaded; a report and/or a custom framework can also be loaded automatically via <code>?report=</code>/<code>?framework=</code> URL parameters when the page is served over http(s). Added example POSI assessment reports based on real published self-assessments (OpenAIRE, OpenAlex, HAL+/CCSD), one-click loadable from the About dialog. Author identifiers (ORCID) and affiliations (ROR) are now on record in <code>CITATION.cff</code> and credited in the About dialog. Added the SURF logo to the top bar and as the favicon. Fixed the Import/Export menus to match Oat’s own dropdown behaviour (items now highlight on hover/focus, matching the component library) and gave the Export items the same description text as Import’s.</dd>' +
                '<dt>2026-08-26</dt><dd>Redesigned sidebar navigation and assessment badge; added support for multiple assessment frameworks side by side, with SPII v0.0.1 (draft) alongside POSI; inline SVG icons for maturity levels and classification activities.</dd>' +
                '<dt>2026-08-25</dt><dd>Rebuilt around the POSI v2.0 principles as a data-driven framework, with JSON export/reload and a downloadable assessment badge (SVG/PNG).</dd>' +
                "<dt>2026-08-12</dt><dd>Relicensed under EUPL-1.2, with citation metadata added.</dd>" +
                "<dt>2026-08-03</dt><dd>Added PDF export, an overall compliance score, and mobile/print styling improvements.</dd>" +
                "<dt>2026-07-31</dt><dd>First version of the tool.</dd>" +
                "</dl>";

            const ICONS = {

            function activity_icon_markup(item, size, strokeColor, extraAttrs) {

                if (!body) return "";
                return (
                    '<svg viewBox="0 0 20 20" width="' + size + '" height="' + size +
                    '" fill="none" stroke="' + strokeColor + '" stroke-width="1.6"' +
                    (extraAttrs || "") + ">" + body + "</svg>"
                );

            function today_iso_date() {
                const d = new Date();
                return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
            }

            const BUILTIN_FRAMEWORK_FILES = ["data/frameworks/spii.json", "data/frameworks/posi.json", "data/frameworks/gorc.json", "data/frameworks/fair.json", "data/frameworks/bd.json", "data/frameworks/osr.json"];

            async function load_builtin_frameworks() {
                const loaded = await Promise.all(
                    BUILTIN_FRAMEWORK_FILES.map((path) =>
                        fetch(path).then((res) => {
                            if (!res.ok) throw new Error(path + ": HTTP " + res.status);
                            return res.json();
                        })
                    )
                );
                loaded.forEach((framework, i) => {
                    if (!validate_framework_shape(framework)) throw new Error(BUILTIN_FRAMEWORK_FILES[i] + ": invalid framework shape");
                });
                return loaded;
            }

            let FRAMEWORKS = [];


            function framework_state_slice(framework) {
                const entries = {};
                framework.sections.forEach((section) => {
                    section.principles.forEach((principle) => {
                        entries[principle.id] = { status: null, notes: "" };
                    });
                });
                return entries;
            }

            function validate_framework_shape(obj) {
                if (!obj || typeof obj !== "object") return false;
                if (typeof obj.id !== "string" || !obj.id) return false;
                if (typeof obj.title !== "string" || !obj.title) return false;
                if (!Array.isArray(obj.sections) || obj.sections.length === 0) return false;
                return obj.sections.every((section) => {
                    if (!section || typeof section.section !== "string" || !section.section) return false;
                    if (!Array.isArray(section.principles) || section.principles.length === 0) return false;
                    return section.principles.every(
                        (p) => p && typeof p.id === "string" && p.id && typeof p.title === "string" && p.title && typeof p.text === "string"
                    );
                });
            }

            function initial_state() {
                const frameworks = {};
                FRAMEWORKS.forEach((framework) => {
                    frameworks[framework.id] = framework_state_slice(framework);
                });
                return {
                    name: "",
                    description: "",
                    url: "",
                    assessedOn: today_iso_date(),
                    activities: [],
                    customFrameworks: [],
                    frameworks,
                };
            }

            function compute_summary(state, frameworkId) {
                const entries = Object.values(state.frameworks[frameworkId] || {});
                const scored = entries.filter((e) => e.status !== null);
                const compliant = scored.filter((e) => e.status === "compliant").length;
                const progress = scored.filter((e) => e.status === "progress").length;
                const nonCompliant = scored.filter((e) => e.status === "non-compliant").length;
                const percentCompliant = scored.length ? Math.round((compliant / scored.length) * 100) : 0;
                return {
                    compliant,
                    progress,
                    nonCompliant,
                    scoredCount: scored.length,
                    totalCount: entries.length,
                    percentCompliant,
                };
            }

            function build_export_object(state) {
                const frameworks = {};
                Object.keys(state.frameworks).forEach((frameworkId) => {
                    const entries = {};
                    Object.keys(state.frameworks[frameworkId]).forEach((id) => {
                        entries[id] = { status: state.frameworks[frameworkId][id].status, notes: state.frameworks[frameworkId][id].notes };
                    });
                    frameworks[frameworkId] = entries;
                });
                return {
                    name: state.name,
                    description: state.description,
                    url: state.url,
                    assessedOn: state.assessedOn,
                    activities: state.activities.slice(),
                    customFrameworks: state.customFrameworks.slice(),
                    frameworks,
                };
            }

            function merge_loaded_state(loaded, base) {
                const fresh = base || initial_state();
                if (!loaded || typeof loaded !== "object") return fresh;
                if (typeof loaded.name === "string") fresh.name = loaded.name;
                if (typeof loaded.description === "string") fresh.description = loaded.description;
                if (typeof loaded.url === "string") fresh.url = loaded.url;
                fresh.assessedOn = typeof loaded.assessedOn === "string" && /^\d{4}-\d{2}-\d{2}$/.test(loaded.assessedOn) ? loaded.assessedOn : today_iso_date();
                if (Array.isArray(loaded.activities)) fresh.activities = loaded.activities.slice();
                if (Array.isArray(loaded.customFrameworks)) {
                    const knownIds = FRAMEWORKS.map((f) => f.id).concat(fresh.customFrameworks.map((f) => f.id));
                    loaded.customFrameworks.forEach((framework) => {
                        if (!validate_framework_shape(framework) || knownIds.includes(framework.id)) return;
                        knownIds.push(framework.id);
                        fresh.customFrameworks.push(framework);
                        fresh.frameworks[framework.id] = framework_state_slice(framework);
                    });
                }
                if (loaded.frameworks && typeof loaded.frameworks === "object") {
                    Object.keys(fresh.frameworks).forEach((frameworkId) => {
                        const loadedFramework = loaded.frameworks[frameworkId];
                        if (!loadedFramework || typeof loadedFramework !== "object") return;
                        Object.keys(fresh.frameworks[frameworkId]).forEach((id) => {
                            const entry = loadedFramework[id];
                            if (entry && typeof entry === "object") {
                                fresh.frameworks[frameworkId][id].status = ["compliant", "progress", "non-compliant"].includes(entry.status) ? entry.status : null;
                                fresh.frameworks[frameworkId][id].notes = typeof entry.notes === "string" ? entry.notes : "";
                            }
                        });
                    });
                }
                return fresh;
            }

            function ring_segment_offsets(radius, count) {
                const circumference = 2 * Math.PI * radius;
                const segmentLength = circumference / count;
                const gap = circumference - segmentLength;
                const offsets = [];
                for (let i = 0; i < count; i++) {
                    offsets.push({
                        dasharray: segmentLength + " " + gap,
                        dashoffset: -(i * segmentLength),
                    });
                }
                return offsets;
            }
        </script>

        <script id="app-render">
            let state = null;
            let activeFrameworkId = null;
            let activeTabId = "infra-description";

            function all_frameworks() {
                return FRAMEWORKS.concat(state.customFrameworks);
            }

            function show_toast(message, variant) {
                const toastRegion = document.getElementById("toast-region");
                // nav[data-topnav] now wraps onto 2-3 rows on narrow viewports
                // (see CSS), so its rendered height is no longer a fixed
                // constant the way a hardcoded CSS top: 5rem assumed — read
                // it fresh on every call instead, since a toast can be shown
                // at any viewport width.
                const navBottom = document.querySelector("nav[data-topnav]").getBoundingClientRect().bottom;
                toastRegion.style.top = Math.max(navBottom + 12, 0) + "px";
                const toast = document.createElement("div");
                toast.setAttribute("role", "alert");
                toast.setAttribute("data-variant", variant || "error");
                const text = document.createElement("p");
                text.textContent = message;
                toast.appendChild(text);
                const closeBtn = document.createElement("button");
                closeBtn.type = "button";
                closeBtn.className = "toast-close";
                closeBtn.setAttribute("aria-label", "Dismiss");
                closeBtn.textContent = "×";
                closeBtn.addEventListener("click", () => toast.remove());
                toast.appendChild(closeBtn);
                toastRegion.appendChild(toast);
                setTimeout(() => toast.remove(), 8000);
            }

            function render() {
                const app = document.getElementById("app");
                app.innerHTML = "";
                app.appendChild(render_header());
                app.appendChild(render_tabs());
                render_sidebar_nav();
                render_sidebar_footer();
                wire_up_events();
                update_summary();
                update_badge();
            }

            function tab_defs() {
                return [{ id: "infra-description", label: "OS Infrastructure Description" }].concat(
                    all_frameworks().map((framework) => ({ id: framework.id, label: framework.title }))
                );
            }

            function tab_label_text(tabId, baseLabel) {
                const framework = all_frameworks().find((f) => f.id === tabId);
                if (!framework) return baseLabel;
                const summary = compute_summary(state, framework.id);
                return baseLabel + " (" + summary.scoredCount + "/" + summary.totalCount + " scored)";
            }

            function render_tabs() {
                const wrap = document.createElement("div");
                wrap.id = "main-tabs";

                const tablist = document.createElement("div");
                tablist.setAttribute("role", "tablist");

                const defs = tab_defs();
                defs.forEach((def) => {
                    const tab = document.createElement("button");
                    tab.type = "button";
                    tab.setAttribute("role", "tab");
                    tab.id = "tab-" + def.id;
                    tab.setAttribute("aria-controls", "tabpanel-" + def.id);
                    tab.setAttribute("aria-selected", def.id === activeTabId ? "true" : "false");
                    tab.dataset.tabId = def.id;
                    tab.textContent = tab_label_text(def.id, def.label);
                    tab.addEventListener("click", () => switch_tab(def.id));
                    tablist.appendChild(tab);
                });
                wrap.appendChild(tablist);

                const panelContent = {
                    "infra-description": () => render_infra_description_section(),
                };
                all_frameworks().forEach((framework) => {
                    panelContent[framework.id] = () => render_framework_section(framework);
                });

                defs.forEach((def) => {
                    const panel = document.createElement("div");
                    panel.setAttribute("role", "tabpanel");
                    panel.id = "tabpanel-" + def.id;
                    panel.setAttribute("aria-labelledby", "tab-" + def.id);
                    panel.hidden = def.id !== activeTabId;
                    panel.appendChild(panelContent[def.id]());
                    wrap.appendChild(panel);
                });

                return wrap;
            }

            function switch_tab(tabId) {
                activeTabId = tabId;
                document.querySelectorAll('[role="tab"]').forEach((tab) => {
                    tab.setAttribute("aria-selected", tab.dataset.tabId === tabId ? "true" : "false");
                });
                document.querySelectorAll('[role="tabpanel"]').forEach((panel) => {
                    panel.hidden = panel.id !== "tabpanel-" + tabId;
                });
                // Sidebar framework groups are a single-open accordion: whichever
                // group matches the active tab opens, every other one collapses.
                document.querySelectorAll('#sidebar-nav details[data-framework-id]').forEach((details) => {
                    details.open = details.dataset.frameworkId === tabId;
                });
                if (all_frameworks().some((f) => f.id === tabId)) {
                    activeFrameworkId = tabId;
                    update_badge();
                    history.replaceState(null, "", "#" + tabId);
                } else {
                    history.replaceState(null, "", location.pathname + location.search);
                }
            }

            // Reads the framework id from the URL hash (case-insensitive, so
            // "#GORC" and "#gorc" both match), if any built-in or custom
            // framework has that id. Usable before boot() sets up `state`
            // (falls back to just the built-ins, since nothing else exists yet).
            function framework_id_from_hash() {
                const raw = location.hash.slice(1).toLowerCase();
                if (!raw) return null;
                const pool = state ? all_frameworks() : FRAMEWORKS;
                return pool.some((f) => f.id === raw) ? raw : null;
            }

            function navigate_to(tabId, anchorId) {
                if (tabId) switch_tab(tabId);
                const target = document.getElementById(anchorId);
                if (!target) return;
                if (target.tagName === "DETAILS") target.open = true;
                target.scrollIntoView({ block: "start" });
            }

            function render_sidebar_nav() {
                const nav = document.getElementById("sidebar-nav");
                nav.innerHTML = "";
                const ul = document.createElement("ul");

                ul.appendChild(render_nav_link("infra-description-section", "OS Infrastructure Description", "infra-description"));

                all_frameworks().forEach((framework) => {
                    const li = document.createElement("li");
                    const groupDetails = document.createElement("details");
                    groupDetails.dataset.frameworkId = framework.id;
                    groupDetails.open = framework.id === activeTabId;
                    const summary = document.createElement("summary");
                    const a = document.createElement("a");
                    a.href = "#framework-" + framework.id;
                    a.textContent = framework.title + (framework.draft ? " (draft)" : "");
                    summary.appendChild(a);
                    a.addEventListener("click", (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        navigate_to(framework.id, "framework-" + framework.id);
                    });
                    groupDetails.appendChild(summary);

                    const subUl = document.createElement("ul");
                    framework.sections.forEach((section) => {
                        const sectionLi = render_nav_link(section_id(framework.id, section), section.section, framework.id);

                        const principleUl = document.createElement("ul");
                        principleUl.className = "nav-principle-list";
                        section.principles.forEach((principle) => {
                            principleUl.appendChild(render_principle_nav_link(framework.id, principle));
                        });
                        sectionLi.appendChild(principleUl);

                        subUl.appendChild(sectionLi);
                    });
                    groupDetails.appendChild(subUl);

                    li.appendChild(groupDetails);
                    ul.appendChild(li);
                });

                nav.appendChild(ul);
            }

            function render_nav_link(anchorId, label, tabId) {
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = "#" + anchorId;
                a.textContent = label;
                a.addEventListener("click", (e) => {
                    e.preventDefault();
                    navigate_to(tabId, anchorId);
                });
                li.appendChild(a);
                return li;
            }

            function render_principle_nav_link(frameworkId, principle) {
                const anchorId = "principle-" + frameworkId + "-" + principle.id;
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = "#" + anchorId;
                const icon = document.createElement("span");
                icon.className = "nav-status-icon";
                icon.id = "nav-status-icon-" + frameworkId + "-" + principle.id;
                const status = state.frameworks[frameworkId][principle.id].status || "unanswered";
                icon.dataset.status = status;
                icon.innerHTML = ICONS[status];
                a.appendChild(icon);
                a.appendChild(document.createTextNode(principle.title));
                a.addEventListener("click", (e) => {
                    e.preventDefault();
                    navigate_to(frameworkId, anchorId);
                });
                li.appendChild(a);
                return li;
            }

            function render_sidebar_footer() {
                const footer = document.getElementById("sidebar-footer");
                footer.innerHTML = "";

                const details = document.createElement("details");

                const summary = document.createElement("summary");
                summary.textContent = "Assessment badge";
                details.appendChild(summary);

                const badgeWrap = document.createElement("div");
                badgeWrap.className = "badge-wrap";
                badgeWrap.tabIndex = 0;
                const preview = document.createElement("div");
                preview.id = "badge-preview";
                badgeWrap.appendChild(preview);
                const hovercard = document.createElement("div");
                hovercard.id = "badge-hovercard";
                hovercard.className = "hovercard";
                badgeWrap.appendChild(hovercard);
                details.appendChild(badgeWrap);

                const svgBtn = document.createElement("button");
                svgBtn.textContent = "Download badge (SVG)";
                svgBtn.addEventListener("click", download_badge_svg);
                details.appendChild(svgBtn);

                const pngBtn = document.createElement("button");
                pngBtn.textContent = "Download badge (PNG)";
                pngBtn.addEventListener("click", download_badge_png);
                details.appendChild(pngBtn);

                const embedBtn = document.createElement("button");
                embedBtn.textContent = "Embed badge";
                embedBtn.addEventListener("click", copy_badge_embed);
                details.appendChild(embedBtn);

                footer.appendChild(details);
            }

            function render_header() {
                const wrap = document.createElement("div");

                const intro = document.createElement("p");
                intro.textContent = "Self-assess how your Open Science infrastructure puts open science values and principles into practice, against one or more community-recognised assessment frameworks.";
                wrap.appendChild(intro);

                return wrap;
            }

            function render_framework_summary(framework) {
                const section = document.createElement("section");
                section.className = "summary-section";
                const heading = document.createElement("strong");
                heading.id = "summary-heading-" + framework.id;
                heading.className = "summary-heading";
                heading.textContent = "Overall: 0% compliant";
                const counts = document.createElement("span");
                counts.id = "summary-counts-" + framework.id;
                section.appendChild(heading);
                section.appendChild(counts);
                return section;
            }

            function render_framework_section(framework) {
                const section = document.createElement("section");
                section.id = "framework-" + framework.id;
                if (framework.draft) {
                    const alertBox = document.createElement("div");
                    alertBox.setAttribute("role", "alert");
                    alertBox.setAttribute("data-variant", "warning");
                    alertBox.textContent = "Draft – work in progress. This framework's principles and scoring criteria may still change.";
                    section.appendChild(alertBox);
                }
                const h2 = document.createElement("h2");
                h2.textContent = framework.title;
                section.appendChild(h2);

                const desc = document.createElement("p");
                desc.textContent = framework.description;
                section.appendChild(desc);

                const about = document.createElement("details");
                about.innerHTML = "<summary>About " + framework.shortName + "</summary>" + framework.aboutHtml;
                section.appendChild(about);

                section.appendChild(render_framework_summary(framework));

                framework.sections.forEach((frameworkSection) => {
                    section.appendChild(render_framework_content_section(frameworkSection, framework.id));
                });

                return section;
            }

            function render_text_field(id, labelText, value, type, placeholder) {

                label.className = "field";
                label.htmlFor = id;
                const span = document.createElement("span");
                span.textContent = labelText;
                label.appendChild(span);
                const input = document.createElement("input");
                input.type = type;
                input.id = id;
                input.value = value;
                if (placeholder) input.placeholder = placeholder;
                label.appendChild(input);
                return label;
            }

            function render_textarea_field(id, labelText, value, placeholder) {
                const label = document.createElement("label");
                label.className = "field";
                label.htmlFor = id;
                const span = document.createElement("span");
                span.textContent = labelText;
                label.appendChild(span);
                const textarea = document.createElement("textarea");
                textarea.id = id;
                textarea.value = value;
                if (placeholder) textarea.placeholder = placeholder;
                label.appendChild(textarea);

            function render_activity_checkbox(value, labelText) {
                const label = document.createElement("label");
                label.style.display = "block";
                const input = document.createElement("input");
                input.type = "checkbox";
                input.value = value;
                input.checked = state.activities.includes(value);

                label.appendChild(icon);
                label.appendChild(document.createTextNode(" " + labelText));

            function section_id(frameworkId, section) {
                return frameworkId + "-" + section.section.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
            }

            function render_framework_content_section(section, frameworkId) {
                const el = document.createElement("section");
                el.id = section_id(frameworkId, section);
                const h3 = document.createElement("h3");
                h3.textContent = section.section;
                el.appendChild(h3);
                const sourceNote = document.createElement("p");
                sourceNote.innerHTML = 'Source: <a href="' + section.sourceUrl + '">' + section.sourceUrl + "</a>";

                    el.appendChild(render_principle(principle, frameworkId));

            function render_principle(principle, frameworkId) {
                const details = document.createElement("details");
                details.className = "container";
                details.id = "principle-" + frameworkId + "-" + principle.id;
                details.dataset.principleId = principle.id;
                details.dataset.frameworkId = frameworkId;

                const summary = document.createElement("summary");
                const h4 = document.createElement("h4");
                h4.textContent = principle.title;
                summary.appendChild(h4);
                details.appendChild(summary);

                const text = document.createElement("p");
                text.textContent = principle.text;
                details.appendChild(text);

                const cards = document.createElement("div");
                cards.className = "row";
                cards.setAttribute("role", "group");
                cards.setAttribute("aria-label", principle.title + " maturity status");
                [
                    { status: "compliant", label: "Compliant" },
                    { status: "progress", label: "Making progress" },
                    { status: "non-compliant", label: "Not compliant" },
                ].forEach((option) => {
                    const card = document.createElement("article");
                    card.className = "card col-4 status-card";
                    card.dataset.status = option.status;
                    card.setAttribute("role", "button");
                    card.setAttribute("tabindex", "0");
                    card.setAttribute("aria-pressed", state.frameworks[frameworkId][principle.id].status === option.status ? "true" : "false");
                    if (state.frameworks[frameworkId][principle.id].status === option.status) {
                        card.classList.add("selected");
                    }
                    const icon = document.createElement("span");
                    icon.className = "status-icon";
                    icon.innerHTML = ICONS[option.status];
                    card.appendChild(icon);

                    const label = document.createElement("p");
                    label.className = "status-label";
                    label.textContent = option.label;
                    card.appendChild(label);

                    if (principle.criteria && principle.criteria[option.status]) {
                        const criteriaText = document.createElement("p");
                        criteriaText.className = "status-criteria";
                        criteriaText.textContent = principle.criteria[option.status];
                        card.appendChild(criteriaText);
                    }

                    cards.appendChild(card);
                });
                details.appendChild(cards);

                const notes = document.createElement("textarea");
                notes.className = "notes";
                notes.placeholder = "Explain your reasoning (optional)";
                notes.value = state.frameworks[frameworkId][principle.id].notes;
                details.appendChild(notes);

                if (principle.improvementAction) {
                    const improvement = document.createElement("p");
                    improvement.className = "improvement-action";
                    improvement.textContent = "To improve: " + principle.improvementAction;
                    details.appendChild(improvement);
                }

                return details;
            }

                    update_badge();

                document.getElementById("infra-description").addEventListener("input", (e) => {
                    state.description = e.target.value;
                });

                document.getElementById("infra-url").addEventListener("input", (e) => {
                    state.url = e.target.value;
                });

                    state.assessedOn = e.target.value;
                    update_badge();
                });

                    if (e.target.matches('input[type="checkbox"]')) {
                        toggle_activity(e.target.value, e.target.checked);

            function toggle_activity(label, checked) {
                if (checked) {
                    if (!state.activities.includes(label)) state.activities.push(label);
                } else {
                    state.activities = state.activities.filter((a) => a !== label);
                }
            }

            function set_status(frameworkId, principleId, status) {
                state.frameworks[frameworkId][principleId].status = state.frameworks[frameworkId][principleId].status === status ? null : status;
                const details = document.querySelector('[data-framework-id="' + frameworkId + '"][data-principle-id="' + principleId + '"]');
                details.querySelectorAll(".status-card").forEach((card) => {
                    const isSelected = card.dataset.status === state.frameworks[frameworkId][principleId].status;
                    card.classList.toggle("selected", isSelected);
                    card.setAttribute("aria-pressed", isSelected ? "true" : "false");
                });
                update_principle_status_icon(frameworkId, principleId, state.frameworks[frameworkId][principleId].status);
                update_summary();
                update_badge();
            }

            function update_principle_status_icon(frameworkId, principleId, status) {
                const icon = document.getElementById("nav-status-icon-" + frameworkId + "-" + principleId);
                if (!icon) return;
                const key = status || "unanswered";
                icon.dataset.status = key;
                icon.innerHTML = ICONS[key];
            }

            function update_summary() {
                all_frameworks().forEach((framework) => {
                    const summary = compute_summary(state, framework.id);
                    const heading = document.getElementById("summary-heading-" + framework.id);
                    const counts = document.getElementById("summary-counts-" + framework.id);
                    if (heading && counts) {
                        heading.textContent = "Overall: " + summary.percentCompliant + "% compliant";
                        counts.textContent =
                            summary.compliant + " compliant · " + summary.progress + " making progress · " +
                            summary.nonCompliant + " not compliant (" + summary.scoredCount + "/" + summary.totalCount + " scored)";
                    }
                    const tab = document.getElementById("tab-" + framework.id);
                    if (tab) tab.textContent = tab_label_text(framework.id, framework.title);

            function download_json_blob(data, filename) {
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: "application/json" });
                trigger_download(URL.createObjectURL(blob), filename);
            }

            function download_json() {
                download_json_blob(build_export_object(state), "results.json");
            }

            // This app doubles as SPII deliverable 1B's own feedback tracker
            // (see CLAUDE.md), so "save to GitHub" targets this same repo.
            const REPORT_TRACKER_REPO = "surf-ori/spii-1b-maturity-assessment-tool";

            function slugify(str) {
                const slug = (str || "").toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
                return slug || "unnamed-infrastructure";
            }

            function report_filename(state, framework) {

            }

            function build_save_report_dialog_html(state, framework, filename) {
                const summary = compute_summary(state, framework.id);

                    "**Infrastructure:** " + name + "\n" +

                    "<span class=\"menuitem-desc\">Drop the downloaded file onto GitHub's new-file page. If you don't have write access to the repo, GitHub forks it for you and opens a pull request back to this one &mdash; no manual fork needed.</span></p>"

            function load_json(file) {

                        show_toast("That file is not valid JSON.", "error");

                ],
